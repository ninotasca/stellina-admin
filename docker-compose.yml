services:
  backend:
    build:
      context: ./backend
    environment:
      API_PORT: 3501
    container_name: stellina-unovento-api-submodule
    ports:
      - "127.0.0.1:3401:3501"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: stellina-admin-frontend
    ports:
      - "127.0.0.1:3402:3402"
    volumes:
      - ./frontend:/app
      - /app/node_modules
