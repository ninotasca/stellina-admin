services:
  frontend:
    build:
      context: ./frontend
    container_name: stellina-admin-frontend
    environment:
      STELLINA_API_PROXY_TARGET: http://host.docker.internal:3301
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3401:3401"
    volumes:
      - ./frontend:/app
      - /app/node_modules
